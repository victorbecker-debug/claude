<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }

      /* ---- Tela 1: upload ---- */
      #zona {
        border: 2px dashed #1a73e8; border-radius: 8px; padding: 40px 20px;
        color: #1a73e8; cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      #zona.hover { background: #e8f0fe; }
      #zona.carregado { border-color: #188038; color: #188038; background: #e6f4ea; }
      #nomeArquivo { margin-top: 12px; font-size: 13px; color: #333; word-break: break-all; min-height: 18px; }
      #btnProcessar {
        margin-top: 18px; padding: 11px 20px; border: none; border-radius: 6px;
        font-size: 14px; color: white; background: #188038; cursor: pointer;
      }
      #btnProcessar:disabled { background: #b7c2ba; cursor: not-allowed; }

      /* ---- Tela 2: opções finais ---- */
      .botoes {
        display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 20px;
      }
      .botoes button {
        padding: 10px 14px; border: none; border-radius: 6px; cursor: pointer;
        font-size: 14px; color: white;
      }
      .visualizar { background: #1a73e8; }
      .cancelar { background: #d93025; }
      .concluir { background: #188038; }

      #status { margin-top: 16px; font-weight: bold; color: #333; min-height: 20px; }
    </style>
  </head>
  <body>

    <!-- TELA 1 — enviar o arquivo -->
    <div id="tela-upload">
      <div id="zona">
        📄 Arraste o arquivo Excel aqui<br>
        <small>ou clique para selecionar</small>
      </div>
      <input type="file" id="input" accept=".xlsx,.xls" style="display:none">
      <div id="nomeArquivo"></div>
      <button id="btnProcessar" disabled onclick="processar()">Processar arquivo</button>
    </div>

    <!-- TELA 2 — opções finais (aparece depois de processar) -->
    <div id="tela-final" style="display:none">
      <div>O processo foi executado. Escolha uma opção:</div>
      <div class="botoes">
        <button class="visualizar" onclick="visualizar()">Visualizar PDF</button>
        <button class="cancelar" onclick="cancelar()">Cancelar operação</button>
        <button class="concluir" onclick="concluir()">Concluir operação</button>
      </div>
    </div>

    <div id="status"></div>

    <script>
      var zona = document.getElementById('zona');
      var input = document.getElementById('input');
      var status = document.getElementById('status');
      var nomeArquivo = document.getElementById('nomeArquivo');
      var btnProcessar = document.getElementById('btnProcessar');
      var telaUpload = document.getElementById('tela-upload');
      var telaFinal = document.getElementById('tela-final');

      var arquivoSelecionado = null;   // arquivo carregado, aguardando o botão
      var pdfBase64 = null;            // preview do PDF, para o botão "Visualizar"

      // ---------- TELA 1: carregar e processar ----------

      zona.addEventListener('click', function() { input.click(); });
      zona.addEventListener('dragover', function(e) { e.preventDefault(); zona.classList.add('hover'); });
      zona.addEventListener('dragleave', function() { zona.classList.remove('hover'); });
      zona.addEventListener('drop', function(e) {
        e.preventDefault();
        zona.classList.remove('hover');
        if (e.dataTransfer.files.length > 0) { carregar(e.dataTransfer.files[0]); }
      });
      input.addEventListener('change', function() {
        if (input.files.length > 0) { carregar(input.files[0]); }
      });

      // PASSO 1 — só carrega o arquivo em memória e habilita o botão
      function carregar(file) {
        if (!file) return;
        var nomeLower = file.name.toLowerCase();
        if (!nomeLower.endsWith('.xlsx') && !nomeLower.endsWith('.xls')) {
          arquivoSelecionado = null;
          btnProcessar.disabled = true;
          zona.classList.remove('carregado');
          status.style.color = '#d93025';
          status.textContent = 'Selecione um arquivo Excel (.xlsx ou .xls).';
          return;
        }
        var reader = new FileReader();
        reader.onload = function() {
          arquivoSelecionado = {
            nome: file.name,
            mimeType: file.type || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
            bytes: reader.result.split(',')[1]
          };
          zona.classList.add('carregado');
          zona.innerHTML = '✅ Arquivo carregado<br><small>clique em "Processar arquivo"</small>';
          nomeArquivo.textContent = file.name;
          btnProcessar.disabled = false;
          status.style.color = '#333';
          status.textContent = '';
        };
        reader.onerror = function() {
          arquivoSelecionado = null;
          btnProcessar.disabled = true;
          status.style.color = '#d93025';
          status.textContent = 'Não foi possível ler o arquivo.';
        };
        reader.readAsDataURL(file);
      }

      // PASSO 2 — processa no servidor e, ao terminar, mostra a TELA 2
      function processar() {
        if (!arquivoSelecionado) {
          status.style.color = '#d93025';
          status.textContent = 'Nenhum arquivo carregado.';
          return;
        }
        btnProcessar.disabled = true;
        zona.style.pointerEvents = 'none';
        zona.style.opacity = '0.6';
        status.style.color = '#333';
        status.textContent = '⏳ Processando... isso pode levar alguns segundos.';

        google.script.run
          .withSuccessHandler(function(preview) {
            pdfBase64 = preview.base64;
            telaUpload.style.display = 'none';
            telaFinal.style.display = 'block';
            status.textContent = '';
          })
          .withFailureHandler(function(erro) {
            var msg = (erro && erro.message) ? erro.message : erro;
            status.style.color = '#d93025';
            status.textContent = 'Erro: ' + msg;
            btnProcessar.disabled = false;
            zona.style.pointerEvents = 'auto';
            zona.style.opacity = '1';
            alert('Erro ao processar: ' + msg);
          })
          .processarComArquivo(arquivoSelecionado);
      }

      // ---------- TELA 2: visualizar / concluir / cancelar ----------

      function base64ToBlob(base64, contentType) {
        var byteCharacters = atob(base64);
        var byteNumbers = new Array(byteCharacters.length);
        for (var i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        return new Blob([new Uint8Array(byteNumbers)], { type: contentType });
      }

      function visualizar() {
        try {
          var url = URL.createObjectURL(base64ToBlob(pdfBase64, 'application/pdf'));
          window.open(url, '_blank');
        } catch (e) {
          alert('Não foi possível abrir o PDF.');
        }
      }

      function mostrarLoading(texto) {
        telaFinal.style.display = 'none';
        status.style.color = '#333';
        status.textContent = texto;
      }

      function concluir() {
        mostrarLoading('⏳ Aguarde, estamos concluindo a operação...');
        google.script.run
          .withSuccessHandler(function(msg) {
            google.script.host.close();
            setTimeout(function() { alert(msg); }, 200);
          })
          .withFailureHandler(function(erro) {
            alert((erro && erro.message) ? erro.message : erro);
          })
          .concluirOperacao();
      }

      function cancelar() {
        mostrarLoading('⏳ Cancelando e restaurando os dados...');
        google.script.run
          .withSuccessHandler(function(msg) {
            google.script.host.close();
            setTimeout(function() { alert(msg); }, 200);
          })
          .withFailureHandler(function(erro) {
            alert((erro && erro.message) ? erro.message : erro);
          })
          .cancelarOperacao();
      }
    </script>
  </body>
</html>
