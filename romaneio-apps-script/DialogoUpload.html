<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        text-align: center;
      }

      #zona {
        border: 2px dashed #1a73e8;
        border-radius: 8px;
        padding: 40px 20px;
        color: #1a73e8;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      #zona.hover {
        background: #e8f0fe;
      }

      #nomeArquivo {
        margin-top: 12px;
        font-size: 13px;
        color: #333;
        word-break: break-all;
      }

      #status {
        margin-top: 16px;
        font-weight: bold;
        color: #333;
        min-height: 20px;
      }
    </style>
  </head>

  <body>
    <div id="conteudo">
      <div id="zona">
        📄 Arraste o arquivo Excel aqui<br>
        <small>ou clique para selecionar</small>
      </div>
      <input type="file" id="input" accept=".xlsx,.xls" style="display:none">
      <div id="nomeArquivo"></div>
    </div>

    <div id="status"></div>

    <script>
      var zona = document.getElementById('zona');
      var input = document.getElementById('input');
      var status = document.getElementById('status');
      var nomeArquivo = document.getElementById('nomeArquivo');

      zona.addEventListener('click', function() {
        input.click();
      });

      zona.addEventListener('dragover', function(e) {
        e.preventDefault();
        zona.classList.add('hover');
      });

      zona.addEventListener('dragleave', function() {
        zona.classList.remove('hover');
      });

      zona.addEventListener('drop', function(e) {
        e.preventDefault();
        zona.classList.remove('hover');
        if (e.dataTransfer.files.length > 0) {
          enviar(e.dataTransfer.files[0]);
        }
      });

      input.addEventListener('change', function() {
        if (input.files.length > 0) {
          enviar(input.files[0]);
        }
      });

      function enviar(file) {
        if (!file) return;

        var nomeLower = file.name.toLowerCase();
        if (!nomeLower.endsWith('.xlsx') && !nomeLower.endsWith('.xls')) {
          status.style.color = '#d93025';
          status.textContent = 'Selecione um arquivo Excel (.xlsx ou .xls).';
          return;
        }

        nomeArquivo.textContent = file.name;
        status.style.color = '#333';
        status.textContent = '⏳ Enviando e processando... isso pode levar alguns segundos.';

        // Desabilita novos envios enquanto processa
        zona.style.pointerEvents = 'none';
        zona.style.opacity = '0.6';

        var reader = new FileReader();

        reader.onload = function() {
          // reader.result = "data:<mime>;base64,<conteudo>"
          var base64 = reader.result.split(',')[1];

          google.script.run
            .withSuccessHandler(function(preview) {
              // Fecha este diálogo e abre o diálogo final com o preview do PDF
              google.script.run.abrirDialogoFinal(preview.base64);
              google.script.host.close();
            })
            .withFailureHandler(function(erro) {
              status.style.color = '#d93025';
              status.textContent = 'Erro: ' + (erro.message || erro);
              zona.style.pointerEvents = 'auto';
              zona.style.opacity = '1';
            })
            .processarComArquivo({
              nome: file.name,
              mimeType: file.type ||
                'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
              bytes: base64
            });
        };

        reader.onerror = function() {
          status.style.color = '#d93025';
          status.textContent = 'Não foi possível ler o arquivo.';
          zona.style.pointerEvents = 'auto';
          zona.style.opacity = '1';
        };

        reader.readAsDataURL(file);
      }
    </script>
  </body>
</html>
